<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvZ Custom Levels Top Rating</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: rgba(18, 18, 22, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.25);
      --accent-white: #ffffff;
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #ff4757;
      --success-color: #2ed573;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      transform: translateZ(0);
    }

    .app-container {
      width: 100%;
      max-width: 860px;
      padding: 50px 20px;
      z-index: 1;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(8, 8, 10, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 0 0 12px 12px;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      will-change: transform;
    }

    .btn:hover {
      border-color: var(--card-border-hover);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--text-main);
      color: #000;
      font-weight: 600;
      border: 1px solid #ffffff;
    }

    .btn-primary:hover {
      background: #e6e6e6;
      color: #000;
    }

    .btn-success {
      border-color: rgba(46, 213, 115, 0.3);
      color: var(--success-color);
    }

    .btn-success:hover {
      border-color: var(--success-color);
      background: rgba(46, 213, 115, 0.1);
    }

    .btn-danger {
      border-color: rgba(255, 71, 87, 0.3);
      color: var(--danger-color);
    }

    .btn-danger:hover {
      border-color: var(--danger-color);
      background: rgba(255, 71, 87, 0.1);
    }

    .btn-icon {
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .levels-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .level-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      transition: border-color 0.25s, background-color 0.25s, transform 0.25s;
      animation: fadeIn 0.3s ease forwards;
      will-change: transform, opacity;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .level-card:hover {
      border-color: var(--card-border-hover);
      background: rgba(26, 26, 32, 0.95);
      transform: translateY(-2px);
    }

    .level-rank {
      font-size: 1.6rem;
      font-weight: 800;
      min-width: 55px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .level-rank.top-1 {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
    }

    .level-details {
      flex: 1;
    }

    .level-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .level-meta {
      font-size: 0.83rem;
      color: var(--text-muted);
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .level-meta span b {
      color: var(--text-main);
      font-weight: 500;
    }

    .level-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      will-change: opacity;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #121216;
      border: 1px solid var(--card-border-hover);
      border-radius: 16px;
      width: 100%;
      max-width: 580px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.96);
      transition: transform 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
      will-change: transform;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-header h3 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background: #09090c;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--accent-white);
    }

    input[type="file"].form-control {
      padding: 9px;
      font-size: 0.85rem;
    }

    .admin-section-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 20px 0 12px 0;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-main);
    }

    .request-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    @media (max-width: 640px) {
      .level-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .level-actions {
        width: 100%;
        justify-content: flex-end;
        margin-top: 10px;
      }
      header {
        flex-direction: column;
        gap: 15px;
        align-items: flex-start;
      }
    }
  </style>

</head>
<body>

  <canvas id="particles"></canvas>

  <div class="app-container">
    <header>
      <div class="brand-title">PvZ Hard Levels Top</div>
      <div class="header-actions">
        <button class="btn" onclick="openModal('submitModal')">Подать заявку</button>
        <button class="btn" onclick="openAdminModal()">Админ Панель</button>
      </div>
    </header>

    <main class="levels-list" id="levelsContainer"></main>
  </div>

  <div class="modal-overlay" id="submitModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Подача заявки уровня</h3>
        <button class="close-btn" onclick="closeModal('submitModal')">&times;</button>
      </div>
      <form id="submissionForm" onsubmit="handleUserSubmit(event)">
        <div class="form-group">
          <label>Название уровня</label>
          <input type="text" class="form-control" id="userTitle" placeholder="Например: Dark Matter Roof" required>
        </div>
        <div class="form-group">
          <label>Автор уровня</label>
          <input type="text" class="form-control" id="userAuthor" placeholder="Ваш никнейм" required>
        </div>
        <div class="form-group">
          <label>Ник верификатора</label>
          <input type="text" class="form-control" id="userVerifier" placeholder="Кто прошёл уровень" required>
        </div>
        <div class="form-group">
          <label>Ссылка на видео (YouTube / Bilibili)</label>
          <input type="url" class="form-control" id="userVideo" placeholder="https://..." required>
        </div>
        <div class="form-group">
          <label>Файл уровня (.βdiy)</label>
          <input type="file" class="form-control" id="userFile" accept=".βdiy" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Отправить заявку</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="adminModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="adminModalTitle">Авторизация Администратора</h3>
        <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
      </div>

      <div id="adminAuthBlock">
        <div class="form-group">
          <label>Введите пароль администратора</label>
          <input type="password" class="form-control" id="adminPasswordInput" placeholder="">
        </div>
        <button class="btn btn-primary" style="width: 100%;" onclick="attemptAdminLogin()">Войти</button>
      </div>

      <div id="adminContentBlock" style="display: none;">
        <div class="admin-section-title">📥 Входящие заявки</div>
        <div id="requestsContainer">Загрузка заявок...</div>

        <div class="admin-section-title">➕ Добавить уровень вручную</div>
        <form id="adminAddForm" onsubmit="handleAdminAddLevel(event)">
          <div class="form-group">
            <label>Позиция в топе (#)</label>
            <input type="number" class="form-control" id="admPos" min="1" value="1" required>
          </div>
          <div class="form-group">
            <label>Название уровня</label>
            <input type="text" class="form-control" id="admTitle" required>
          </div>
          <div class="form-group">
            <label>Автор</label>
            <input type="text" class="form-control" id="admAuthor" required>
          </div>
          <div class="form-group">
            <label>Верификатор</label>
            <input type="text" class="form-control" id="admVerifier" required>
          </div>
          <div class="form-group">
            <label>Ссылка на видео</label>
            <input type="url" class="form-control" id="admVideo" required>
          </div>
          <div class="form-group">
            <label>Файл уровня (.βdiy)</label>
            <input type="file" class="form-control" id="admFile" accept=".βdiy" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">Опубликовать в топ</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d', { alpha: false });
    let particlesArray = [];
    let lastTime = performance.now();

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : -10;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 25 + 10;
        this.speedX = (Math.random() - 0.5) * 5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update(dt) {
        this.y += this.speedY * dt;
        this.x += this.speedX * dt;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function initParticles() {
      particlesArray = [];
      const count = Math.min(Math.floor((canvas.width * canvas.height) / 20000), 60);
      for (let i = 0; i < count; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      ctx.fillStyle = '#08080a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update(dt);
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(animateParticles);

    const ADMIN_PASS = "envelope";
    let isAdmin = false;

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, match => {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return map[match];
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function renderLevels() {
      const container = document.getElementById('levelsContainer');

      db.collection('levels').orderBy('position', 'asc').onSnapshot((snapshot) => {
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">Рейтинг пока пуст.</div>`;
          return;
        }

        snapshot.docs.forEach((doc, index) => {
          const lvl = doc.data();
          const docId = doc.id;
          const card = document.createElement('div');
          card.className = 'level-card';

          card.innerHTML = `
            <div class="level-rank ${index === 0 ? 'top-1' : ''}">#${index + 1}</div>
            <div class="level-details">
              <div class="level-title">${escapeHtml(lvl.title)}</div>
              <div class="level-meta">
                <span>Автор: <b>${escapeHtml(lvl.author)}</b></span>
                <span>Верификатор: <b>${escapeHtml(lvl.verifier)}</b></span>
              </div>
            </div>
            <div class="level-actions">
              <a href="${escapeHtml(lvl.video)}" target="_blank" rel="noopener" class="btn btn-icon">▶ Видео</a>
              <button class="btn btn-primary btn-icon" onclick="downloadBdiyFile('${docId}')">Скачать .βdiy</button>
              ${isAdmin ? `
                <button class="btn btn-danger btn-icon" onclick="deleteLevel('${docId}')">✕</button>
              ` : ''}
            </div>
          `;
          container.appendChild(card);
        });
      }, (error) => {
        console.error("Ошибка загрузки данных из базы Firebase:", error);
      });
    }

    async function downloadBdiyFile(docId, collectionName = 'levels') {
      try {
        const doc = await db.collection(collectionName).doc(docId).get();
        if (!doc.exists) return;
        const level = doc.data();

        const a = document.createElement('a');
        a.href = level.fileData;
        a.download = level.fileName || `${level.title.replace(/\s+/g, '_')}.βdiy`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (error) {
        alert('Ошибка при скачивании файла.');
      }
    }

    async function handleUserSubmit(e) {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerText;

      const title = document.getElementById('userTitle').value;
      const author = document.getElementById('userAuthor').value;
      const verifier = document.getElementById('userVerifier').value;
      const video = document.getElementById('userVideo').value;
      const fileInput = document.getElementById('userFile');
      const file = fileInput.files[0];

      if (file && !file.name.endsWith('.βdiy')) {
        alert('Пожалуйста, выберите файл с расширением .βdiy');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Сохранение...';

      try {
        const fileData = await fileToDataURL(file);

        await db.collection('requests').add({
          title,
          author,
          verifier,
          video,
          fileData,
          fileName: file.name,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Заявка успешно отправлена на рассмотрение!');
        document.getElementById('submissionForm').reset();
        closeModal('submitModal');
      } catch (error) {
        console.error('Submit Error:', error);
        alert('Ошибка отправки заявки. Попробуйте снова.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = originalBtnText;
      }
    }

    function openAdminModal() { openModal('adminModal'); }

    function attemptAdminLogin() {
      const pass = document.getElementById('adminPasswordInput').value;
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        document.getElementById('adminAuthBlock').style.display = 'none';
        document.getElementById('adminContentBlock').style.display = 'block';
        document.getElementById('adminModalTitle').innerText = 'Управление сайтом';
        renderLevels();
        renderRequests();
      } else {
        alert('Неверный пароль администратора!');
      }
    }

    function renderRequests() {
      const container = document.getElementById('requestsContainer');

      db.collection('requests').orderBy('createdAt', 'desc').onSnapshot((snapshot) => {
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem;">Новых заявок пока нет.</div>`;
          return;
        }

        snapshot.docs.forEach((doc) => {
          const req = doc.data();
          const docId = doc.id;

          const card = document.createElement('div');
          card.className = 'request-card';
          card.innerHTML = `
            <div style="font-weight: 600; color: #fff;">${escapeHtml(req.title)}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">
              Автор: <b>${escapeHtml(req.author)}</b> | Верификатор: <b>${escapeHtml(req.verifier)}</b>
            </div>
            <div style="display: flex; gap: 8px; margin-top: 6px;">
              <a href="${escapeHtml(req.video)}" target="_blank" class="btn btn-icon">▶ Видео</a>
              <button class="btn btn-icon" onclick="downloadBdiyFile('${docId}', 'requests')">💾 Файл</button>
              <button class="btn btn-success btn-icon" onclick="approveRequest('${docId}')">✓ Принять в Топ</button>
              <button class="btn btn-danger btn-icon" onclick="deleteRequest('${docId}')">✕ Отклонить</button>
            </div>
          `;
          container.appendChild(card);
        });
      });
    }

    async function approveRequest(reqId) {
      const posStr = prompt('На какую позицию в ТОП поместить уровень?', '1');
      if (!posStr) return;

      const pos = parseInt(posStr) || 1;

      try {
        const doc = await db.collection('requests').doc(reqId).get();
        if (!doc.exists) return;

        const reqData = doc.data();

        await db.collection('levels').add({
          title: reqData.title,
          author: reqData.author,
          verifier: reqData.verifier,
          video: reqData.video,
          fileData: reqData.fileData,
          fileName: reqData.fileName,
          position: pos,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection('requests').doc(reqId).delete();

        alert('Уровень перенесен в основной ТОП!');
      } catch (err) {
        console.error(err);
        alert('Ошибка при переносе уровня.');
      }
    }

    async function deleteRequest(reqId) {
      if (!confirm('Удалить эту заявку?')) return;
      try {
        await db.collection('requests').doc(reqId).delete();
      } catch (err) {
        alert('Ошибка при удалении заявки.');
      }
    }

    async function handleAdminAddLevel(e) {
      e.preventDefault();
      const fileInput = document.getElementById('admFile');
      const file = fileInput.files[0];
      if (!file) return;

      const fileData = await fileToDataURL(file);
      const pos = parseInt(document.getElementById('admPos').value);

      try {
        await db.collection('levels').add({
          title: document.getElementById('admTitle').value,
          author: document.getElementById('admAuthor').value,
          verifier: document.getElementById('admVerifier').value,
          video: document.getElementById('admVideo').value,
          fileData: fileData,
          fileName: file.name,
          position: pos,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Уровень успешно сохранён в общую базу данных!');
        document.getElementById('adminAddForm').reset();
        closeModal('adminModal');
      } catch (err) {
        console.error('Ошибка добавления:', err);
        alert('Не удалось сохранить уровень в Firebase.');
      }
    }

    async function deleteLevel(docId) {
      if (!confirm('Удалить уровень из общей базы?')) return;
      try {
        await db.collection('levels').doc(docId).delete();
      } catch (err) {
        alert('Ошибка при удалении уровня.');
      }
    }

    renderLevels();
  </script>
</body>
</html>
