<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PvZ Hard Levels Top / Custom Levels</title>
  <style>
    :root {
      --bg-color: #08080a;
      --card-bg: rgba(18, 18, 22, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.25);
      --accent-white: #ffffff;
      --text-main: #f0f0f5;
      --text-muted: #8a8a9e;
      --danger-color: #ff4757;
      --success-color: #2ed573;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #particles {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1; pointer-events: none; transform: translateZ(0);
    }

    .app-container { width: 100%; max-width: 860px; padding: 40px 20px; z-index: 1; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 40px; padding: 16px 20px;
      border-bottom: 1px solid var(--card-border);
      background: rgba(8, 8, 10, 0.7);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 12px;
    }

    .brand-title {
      font-size: 1.2rem; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a1a1a1 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .header-right-zone { display: flex; align-items: center; gap: 16px; }
    .header-actions-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .admin-icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main); font-size: 1.1rem; padding: 6px 10px;
      border-radius: 8px; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
      display: flex; align-items: center; justify-content: center;
    }

    .admin-icon-btn:hover {
      border-color: var(--card-border-hover);
      background: rgba(255, 255, 255, 0.12); transform: scale(1.05);
    }

    /* УВЕЛИЧЕННЫЙ ПРОФИЛЬ В ШАПКЕ */
    .user-profile-widget {
      display: flex; align-items: center; gap: 12px; padding: 6px 14px;
      border-radius: 24px; cursor: pointer;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border);
      transition: background 0.2s, border-color 0.2s;
    }

    .user-profile-widget:hover {
      background: rgba(255, 255, 255, 0.08); border-color: var(--card-border-hover);
    }

    .avatar-circle {
      width: 44px; height: 44px; border-radius: 50%; background: #1e1e24;
      border: 1px solid var(--card-border-hover); display: flex;
      align-items: center; justify-content: center; font-size: 1.4rem;
      overflow: hidden; flex-shrink: 0; user-select: none;
    }

    .user-nickname {
      font-size: 1rem; font-weight: 600; color: var(--text-main);
      max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .btn {
      background: rgba(255, 255, 255, 0.05); color: var(--text-main);
      border: 1px solid var(--card-border); padding: 8px 16px;
      font-size: 0.85rem; font-weight: 500; letter-spacing: 0.5px;
      border-radius: 8px; cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s, transform 0.2s;
      text-decoration: none; display: inline-flex; align-items: center;
      justify-content: center; gap: 6px;
    }

    .btn:hover {
      border-color: var(--card-border-hover); background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
    }

    .btn-primary { background: var(--text-main); color: #000; font-weight: 600; border: 1px solid #ffffff; }
    .btn-primary:hover { background: #e6e6e6; color: #000; }
    .btn-success { border-color: rgba(46, 213, 115, 0.3); color: var(--success-color); }
    .btn-danger { border-color: rgba(255, 71, 87, 0.3); color: var(--danger-color); }
    .btn-icon { padding: 6px 10px; font-size: 0.8rem; }

    .levels-list { display: flex; flex-direction: column; gap: 16px; }

    .level-card-wrapper {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 12px; overflow: hidden; position: relative;
      transition: border-color 0.25s, background-color 0.25s, transform 0.25s;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .level-card-wrapper:hover {
      border-color: var(--card-border-hover); background: rgba(26, 26, 32, 0.95);
    }

    .level-card {
      padding: 18px 20px 10px 20px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px;
    }

    /* УВЕЛИЧЕННОЕ ПРЕВЬЮ УРОВНЯ */
    .level-preview-img {
      width: 110px; height: 80px; border-radius: 8px; object-fit: cover;
      border: 1px solid var(--card-border); pointer-events: none; user-select: none;
    }

    .level-rank {
      font-size: 1.6rem; font-weight: 800; min-width: 45px;
      color: var(--text-muted); font-variant-numeric: tabular-nums;
    }

    .level-rank.top-1 { color: #ffffff; text-shadow: 0 0 12px rgba(255, 255, 255, 0.6); }
    .level-details { flex: 1; }
    .level-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .level-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
    .level-meta span b { color: var(--text-main); font-weight: 500; }
    .level-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .reorder-btns { display: flex; flex-direction: column; gap: 4px; margin-right: 8px; }
    .btn-arrow { padding: 2px 8px; font-size: 0.7rem; line-height: 1; }

    /* ПРОЗРАЧНЫЕ КНОПКИ ЛАЙКОВ И КОММЕНТАРИЕВ ВНИЗУ */
    .level-footer-social {
      display: flex; justify-content: flex-end; align-items: center;
      gap: 12px; padding: 4px 20px 12px 20px; margin-top: -4px;
    }

    .btn-ghost-icon {
      background: transparent !important;
      border: none !important;
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 4px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: color 0.2s, transform 0.15s;
    }

    .btn-ghost-icon:hover {
      color: var(--text-main);
      transform: scale(1.1);
    }

    .btn-ghost-icon.liked {
      color: #ff4757 !important;
      font-weight: bold;
    }

    /* Комментарии */
    .comments-section {
      border-top: 1px solid var(--card-border);
      background: rgba(0, 0, 0, 0.2); padding: 15px 20px; display: none;
    }

    .comments-section.open { display: block; }
    .comments-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; max-height: 200px; overflow-y: auto; }
    .comment-item { font-size: 0.85rem; background: rgba(255, 255, 255, 0.03); padding: 8px 12px; border-radius: 6px; }
    .comment-author { font-weight: 600; color: #fff; margin-bottom: 2px; }
    .comment-text { color: var(--text-main); word-break: break-word; }
    .comment-form { display: flex; gap: 8px; }

    /* Модальные окна */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8); z-index: 100; display: flex;
      align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #121216; border: 1px solid var(--card-border-hover);
      border-radius: 16px; width: 100%; max-width: 500px; padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); transform: scale(0.96);
      transition: transform 0.25s ease; max-height: 90vh; overflow-y: auto;
    }

    .modal-overlay.active .modal-card { transform: scale(1); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .modal-header h3 { font-size: 1.2rem; font-weight: 600; }
    .close-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }
    .close-btn:hover { color: var(--text-main); }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    .form-control { width: 100%; background: #09090c; border: 1px solid var(--card-border); border-radius: 8px; padding: 10px 12px; color: var(--text-main); font-size: 0.9rem; outline: none; }
    .form-control:focus { border-color: var(--accent-white); }
    .checkbox-group { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; }
    .checkbox-group input { margin-top: 3px; }
    .auth-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--card-border); padding-bottom: 10px; }
    .auth-tab { background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; font-weight: 600; }
    .auth-tab.active { color: var(--text-main); border-bottom: 2px solid var(--text-main); }
    .avatar-selector { display: flex; gap: 12px; justify-content: center; margin: 15px 0; }
    .avatar-option { width: 48px; height: 48px; border-radius: 50%; background: #1e1e24; border: 2px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
    .avatar-option.selected { border-color: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.4); }
    .profile-stats { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 20px; }
    .admin-section-title { font-size: 1rem; font-weight: 600; margin: 20px 0 12px 0; padding-bottom: 6px; border-bottom: 1px solid var(--card-border); }
    .request-card { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }

    @media (max-width: 640px) {
      .level-card { flex-direction: column; align-items: flex-start; }
      .level-actions { width: 100%; justify-content: flex-end; margin-top: 10px; }
      header { flex-direction: column; gap: 15px; align-items: flex-start; }
    }
  </style>
  <script>
    /* 1. НАСТРОЙКИ И АНИМАЦИЯ ЧАСТИЦ */
    const VERIFICATION_CHANNEL_URL = "https://youtube.com/@YOUR_CHANNEL"; // Укажите ваш канал

    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d', { alpha: false });
    let particlesArray = [];
    let lastTime = performance.now();

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : -10;
        this.size = Math.random() * 2 + 0.5;
        this.speedY = Math.random() * 25 + 10;
        this.speedX = (Math.random() - 0.5) * 5;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update(dt) {
        this.y += this.speedY * dt;
        this.x += this.speedX * dt;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function initParticles() {
      particlesArray = [];
      const count = Math.min(Math.floor((canvas.width * canvas.height) / 20000), 60);
      for (let i = 0; i < count; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      ctx.fillStyle = '#08080a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update(dt);
        particlesArray[i].draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    requestAnimationFrame(animateParticles);

    /* 2. СОСТОЯНИЕ И ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ МОДАЛОК */
    const ADMIN_UIDS = ["7lPZhSLLnzaE0KmwRb3t5lB9rx72", "СКОПИРОВАННЫЙ_UID_2"];
    let isAdmin = false;
    let authMode = 'login';
    let loadedLevelsDocs = [];
    let currentSelectedAvatar = '🌻';

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, match => {
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return map[match];
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function openSubmitModal() {
      if (!auth.currentUser) {
        alert('Для подачи заявки необходимо войти в аккаунт!');
        openModal('authModal');
        return;
      }
      openModal('submitModal');
    }

    function openVerifyModal() {
      if (!auth.currentUser) {
        alert('Для отправки уровня на верификацию необходимо войти в аккаунт!');
        openModal('authModal');
        return;
      }
      openModal('verifyModal');
    }

    /* 3. АВТОРИЗАЦИЯ, ПРОФИЛИ И УНИКАЛЬНОСТЬ НИКНЕЙМОВ */
    auth.onAuthStateChanged(async (user) => {
      const nickElem = document.getElementById('userNickname');
      const avatarElem = document.getElementById('userAvatar');
      
      if (user) {
        const nick = user.displayName || 'Игрок';
        nickElem.innerText = nick;

        const userDoc = await db.collection('users').doc(user.uid).get();
        if (userDoc.exists && userDoc.data().avatar) {
          currentSelectedAvatar = userDoc.data().avatar;
        } else {
          currentSelectedAvatar = '🌻';
        }
        avatarElem.innerText = currentSelectedAvatar;

        document.getElementById('authFormBlock').style.display = 'none';
        document.getElementById('userInfoBlock').style.display = 'flex';
        document.getElementById('profileNickDisplay').innerText = nick;
        document.getElementById('profileEmailDisplay').innerText = user.email;

        highlightSelectedAvatar(currentSelectedAvatar);
        calculateUserPublishedLevels(nick);

        isAdmin = ADMIN_UIDS.includes(user.uid);
      } else {
        nickElem.innerText = 'Войти';
        avatarElem.innerText = '👤';
        document.getElementById('authFormBlock').style.display = 'block';
        document.getElementById('userInfoBlock').style.display = 'none';
        isAdmin = false;
      }

      renderLevels();
    });

    async function isNicknameTaken(nickname) {
      const snapshot = await db.collection('users').where('nickname_lower', '==', nickname.toLowerCase()).get();
      return !snapshot.empty;
    }

    function switchAuthMode(mode) {
      authMode = mode;
      document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
      document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
      
      document.getElementById('nickGroup').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('passConfirmGroup').style.display = mode === 'register' ? 'block' : 'none';
      document.getElementById('termsGroup').style.display = mode === 'register' ? 'flex' : 'none';
      document.getElementById('authSubmitBtn').innerText = mode === 'register' ? 'Зарегистрироваться' : 'Войти';
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPass').value;

      try {
        if (authMode === 'register') {
          const nick = document.getElementById('authNick').value.trim();
          const passConfirm = document.getElementById('authPassConfirm').value;
          const termsAccepted = document.getElementById('authTerms').checked;

          if (!nick) { alert('Пожалуйста, введите никнейм!'); return; }
          if (pass !== passConfirm) { alert('Пароли не совпадают!'); return; }
          if (!termsAccepted) { alert('Вам необходимо принять условия правил!'); return; }

          const taken = await isNicknameTaken(nick);
          if (taken) {
            alert('Этот никнейм уже занят другим игроком! Попробуйте другой.');
            return;
          }

          const res = await auth.createUserWithEmailAndPassword(email, pass);
          await res.user.updateProfile({ displayName: nick });
          
          await db.collection('users').doc(res.user.uid).set({
            nickname: nick,
            nickname_lower: nick.toLowerCase(),
            avatar: '🌻',
            termsAccepted: true
          });

          alert('Регистрация прошла успешно!');
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
        }
        closeModal('authModal');
      } catch (err) {
        alert('Ошибка: ' + err.message);
      }
    }

    async function selectAvatar(avatarEmoji) {
      const user = auth.currentUser;
      if (!user) return;
      currentSelectedAvatar = avatarEmoji;
      document.getElementById('userAvatar').innerText = avatarEmoji;
      highlightSelectedAvatar(avatarEmoji);

      await db.collection('users').doc(user.uid).set({
        avatar: avatarEmoji,
        nickname: user.displayName || '',
        nickname_lower: (user.displayName || '').toLowerCase()
      }, { merge: true });
    }

    function highlightSelectedAvatar(avatarEmoji) {
      document.querySelectorAll('.avatar-option').forEach(el => {
        el.classList.toggle('selected', el.innerText === avatarEmoji);
      });
    }

    async function calculateUserPublishedLevels(userNick) {
      const snapshot = await db.collection('levels').get();
      let count = 0;
      snapshot.docs.forEach(doc => {
        if (doc.data().author && doc.data().author.toLowerCase() === userNick.toLowerCase()) count++;
      });
      document.getElementById('userLevelsCount').innerText = count;
    }

    function handleProfileClick() { openModal('authModal'); }
    function logoutUser() { auth.signOut(); closeModal('authModal'); }
    /* 4. ЗАГРУЗКА, СОРТИРОВКА И ОТОБРАЖЕНИЕ УРОВНЕЙ */
    function renderLevels() {
      db.collection('levels').onSnapshot((snapshot) => {
        const container = document.getElementById('levelsContainer');
        container.innerHTML = '';
        
        loadedLevelsDocs = snapshot.docs;

        // Сортируем уровни по полю position (от меньшего к большему)
        loadedLevelsDocs.sort((a, b) => {
          const posA = a.data().position || 9999;
          const posB = b.data().position || 9999;
          return posA - posB;
        });

        if (loadedLevelsDocs.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 40px;">Пока нет доступных уровней.</div>';
          return;
        }

        loadedLevelsDocs.forEach((doc, index) => {
          const level = doc.data();
          const docId = doc.id;
          const rank = index + 1;
          const user = auth.currentUser;

          const likes = level.likes || [];
          const isLiked = user ? likes.includes(user.uid) : false;
          const likesCount = likes.length;

          const defaultPreview = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="70" height="50" viewBox="0 0 70 50"><rect width="70" height="50" fill="%231e1e24"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="%238a8a9e" font-size="10">No Image</text></svg>';
          const previewSrc = level.previewData || defaultPreview;

          let adminControls = '';
          if (isAdmin) {
            adminControls = `
              <div class="reorder-btns">
                <button class="btn btn-arrow" onclick="moveLevel('${docId}', -1)">▲</button>
                <button class="btn btn-arrow" onclick="moveLevel('${docId}', 1)">▼</button>
              </div>
              <button class="btn btn-danger btn-icon" onclick="deleteLevel('${docId}')">🗑️</button>
            `;
          }

          const cardHTML = `
            <div class="level-card-wrapper" id="wrapper-${docId}">
              <div class="level-card">
                ${adminControls}
                <div class="level-rank ${rank === 1 ? 'top-1' : ''}">#${rank}</div>
                <img src="${previewSrc}" class="level-preview-img" alt="Preview">
                <div class="level-details">
                  <div class="level-title">${escapeHtml(level.title)}</div>
                  <div class="level-meta">
                    <span>Автор: <b>${escapeHtml(level.author)}</b></span>
                    <span>Верификатор: <b>${escapeHtml(level.verifier)}</b></span>
                  </div>
                </div>
                <div class="level-actions">
                  <a href="${escapeHtml(level.video)}" target="_blank" class="btn btn-success">▶ Видео</a>
                  <button class="btn btn-primary" onclick="downloadBdiyFile('${docId}')">📥 Скачать</button>
                </div>
              </div>

              <div class="level-footer-social">
                <button class="btn-ghost-icon ${isLiked ? 'liked' : ''}" onclick="toggleLike('${docId}')" title="Нравится">
                  ❤️ <span>${likesCount}</span>
                </button>
                <button class="btn-ghost-icon" onclick="toggleComments('${docId}')" title="Комментарии">
                  💬
                </button>
              </div>

              <div class="comments-section" id="comments-${docId}">
                <div class="comments-list" id="comments-list-${docId}">Загрузка комментариев...</div>
                <form class="comment-form" onsubmit="addComment(event, '${docId}')">
                  <input type="text" class="form-control" id="input-comment-${docId}" placeholder="Оставьте комментарий..." required>
                  <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
              </div>
            </div>
          `;

          container.insertAdjacentHTML('beforeend', cardHTML);
        });
      });
    }

    /* 5. ЛАЙКИ И КОММЕНТАРИИ */
    async function toggleLike(docId) {
      const user = auth.currentUser;
      if (!user) {
        alert('Для того чтобы ставить лайки, войдите в аккаунт!');
        openModal('authModal');
        return;
      }

      const docRef = db.collection('levels').doc(docId);
      const doc = await docRef.get();
      if (!doc.exists) return;

      const likes = doc.data().likes || [];
      const uid = user.uid;

      if (likes.includes(uid)) {
        await docRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(uid) });
      } else {
        await docRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(uid) });
      }
    }
    function toggleComments(docId) {
      const elem = document.getElementById(`comments-${docId}`);
      const isOpen = elem.classList.toggle('open');

      if (isOpen) {
        loadComments(docId);
      }
    }

    function loadComments(docId) {
      db.collection('levels').doc(docId).collection('comments')
        .orderBy('createdAt', 'asc')
        .onSnapshot((snapshot) => {
          const listElem = document.getElementById(`comments-list-${docId}`);
          if (!listElem) return;

          listElem.innerHTML = '';
          if (snapshot.empty) {
            listElem.innerHTML = '<div style="color: var(--text-muted); font-size: 0.8rem;">Комментариев пока нет. Будьте первым!</div>';
            return;
          }

          snapshot.docs.forEach((doc) => {
            const data = doc.data();
            const item = `
              <div class="comment-item">
                <div class="comment-author">${escapeHtml(data.author)}</div>
                <div class="comment-text">${escapeHtml(data.text)}</div>
              </div>
            `;
            listElem.insertAdjacentHTML('beforeend', item);
          });
        });
    }

    async function addComment(e, docId) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) {
        alert('Чтобы оставить комментарий, войдите в аккаунт!');
        openModal('authModal');
        return;
      }

      const input = document.getElementById(`input-comment-${docId}`);
      const text = input.value.trim();
      if (!text) return;

      await db.collection('levels').doc(docId).collection('comments').add({
        author: user.displayName || 'Игрок',
        text: text,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      input.value = '';
    }

    /* 6. ОТПРАВКА ЗАЯВОК И СКАЧИВАНИЕ ФАЙЛОВ */
    async function handleUserSubmit(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const file = document.getElementById('userFile').files[0];
      const previewFile = document.getElementById('userPreviewFile').files[0];
      if (!file) return;

      const fileData = await fileToDataURL(file);
      const previewData = previewFile ? await fileToDataURL(previewFile) : null;

      try {
        await db.collection('requests').add({
          type: 'top_submission',
          title: document.getElementById('userTitle').value,
          author: user.displayName || 'Неизвестный',
          verifier: document.getElementById('userVerifier').value,
          video: document.getElementById('userVideo').value,
          fileData: fileData,
          previewData: previewData,
          fileName: file.name,
          userUid: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Ваша заявка успешно отправлена администраторам!');
        document.getElementById('submissionForm').reset();
        closeModal('submitModal');
      } catch (err) {
        alert('Ошибка при отправке заявки.');
      }
    }

    async function handleUserVerifySubmit(e) {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const file = document.getElementById('verifyFile').files[0];
      if (!file) return;

      const fileData = await fileToDataURL(file);

      try {
        await db.collection('requests').add({
          type: 'verification',
          title: document.getElementById('verifyTitle').value,
          author: user.displayName || 'Неизвестный',
          fileData: fileData,
          fileName: file.name,
          userUid: user.uid,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Уровень отправлен на верификацию!');
        document.getElementById('verifyForm').reset();
        closeModal('verifyModal');
      } catch (err) {
        alert('Ошибка отправки.');
      }
    }

    async function downloadBdiyFile(docId, collectionName = 'levels') {
      try {
        const doc = await db.collection(collectionName).doc(docId).get();
        if (!doc.exists) return;
        const level = doc.data();

        const a = document.createElement('a');
        a.href = level.fileData;
        a.download = level.fileName || `${level.title.replace(/\s+/g, '_')}.βdiy`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch (error) {
        alert('Ошибка при скачивании файла.');
      }
    }

    /* 7. АДМИН-ПАНЕЛЬ И СОРТИРОВКА УРОВНЕЙ */
    function openAdminModal() {
      if (!isAdmin) {
        alert('У вас нет прав администратора!');
        return;
      }
      openModal('adminModal');
      loadRequests();
    }

    function loadRequests() {
      db.collection('requests').onSnapshot((snapshot) => {
        const container = document.getElementById('requestsContainer');
        container.innerHTML = '';

        if (snapshot.empty) {
          container.innerHTML = '<div style="font-size: 0.85rem; color: var(--text-muted);">Заявок нет</div>';
          return;
        }

        snapshot.docs.forEach((doc) => {
          const req = doc.data();
          const reqId = doc.id;

          const reqHTML = `
            <div class="request-card">
              <div style="font-weight: 600;">[${req.type === 'verification' ? 'ВЕРИФИКАЦИЯ' : 'В ТОП'}] ${escapeHtml(req.title)}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">Автор: ${escapeHtml(req.author)}</div>
              ${req.video ? `<div style="font-size: 0.8rem;"><a href="${escapeHtml(req.video)}" target="_blank" style="color:#2ed573;">Ссылка на видео</a></div>` : ''}
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                <button class="btn btn-primary btn-icon" onclick="downloadBdiyFile('${reqId}', 'requests')">📥 Файл</button>
                ${req.type === 'top_submission' ? `<button class="btn btn-success btn-icon" onclick="approveRequest('${reqId}')">✓ Принять в ТОП</button>` : ''}
                <button class="btn btn-danger btn-icon" onclick="rejectRequest('${reqId}')">✕ Отклонить</button>
              </div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', reqHTML);
        });
      });
    }

    async function approveRequest(reqId) {
      const doc = await db.collection('requests').doc(reqId).get();
      if (!doc.exists) return;
      const req = doc.data();

      const pos = prompt('На какую позицию поставить уровень?', '1');
      if (!pos) return;

      await db.collection('levels').add({
        title: req.title,
        author: req.author,
        verifier: req.verifier || '—',
        video: req.video || '',
        fileData: req.fileData,
        previewData: req.previewData || null,
        fileName: req.fileName,
        position: parseInt(pos),
        likes: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection('requests').doc(reqId).delete();
      alert('Уровень одобрен и добавлен в общий ТОП!');
    }

    async function rejectRequest(reqId) {
      if (!confirm('Отклонить заявку?')) return;
      await db.collection('requests').doc(reqId).delete();
    }

    async function handleAdminAddLevel(e) {
      e.preventDefault();
      const file = document.getElementById('admFile').files[0];
      const previewFile = document.getElementById('admPreviewFile').files[0];
      if (!file) return;

      const fileData = await fileToDataURL(file);
      const previewData = previewFile ? await fileToDataURL(previewFile) : null;
      const pos = parseInt(document.getElementById('admPos').value);

      try {
        await db.collection('levels').add({
          title: document.getElementById('admTitle').value,
          author: document.getElementById('admAuthor').value,
          verifier: document.getElementById('admVerifier').value,
          video: document.getElementById('admVideo').value,
          fileData: fileData,
          previewData: previewData,
          fileName: file.name,
          position: pos,
          likes: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        alert('Уровень успешно сохранён!');
        document.getElementById('adminAddForm').reset();
        closeModal('adminModal');
      } catch (err) {
        alert('Не удалось сохранить уровень.');
      }
    }

    async function moveLevel(docId, direction) {
      const currentIndex = loadedLevelsDocs.findIndex(d => d.id === docId);
      if (currentIndex === -1) return;

      const targetIndex = currentIndex + direction;
      if (targetIndex < 0 || targetIndex >= loadedLevelsDocs.length) return;

      const currentDoc = loadedLevelsDocs[currentIndex];
      const targetDoc = loadedLevelsDocs[targetIndex];

      const currentPos = currentDoc.data().position || (currentIndex + 1);
      const targetPos = targetDoc.data().position || (targetIndex + 1);

      const batch = db.batch();
      batch.update(db.collection('levels').doc(currentDoc.id), { position: targetPos });
      batch.update(db.collection('levels').doc(targetDoc.id), { position: currentPos });

      await batch.commit();
    }

    async function deleteLevel(docId) {
      if (!confirm('Удалить уровень из общей базы?')) return;
      await db.collection('levels').doc(docId).delete();
    }
  </script>
